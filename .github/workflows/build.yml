name: Keep Alive — Windows Setup Build & Release

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Create or update GitHub Release with Setup EXE"
        required: false
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: keep-alive-setup-${{ github.ref }}
  cancel-in-progress: false

env:
  ACTIONS_RUNNER_FORCE_NODE24: "true"
  FORCE_JAVASCRIPT_ACTIONS_ON_NODE24: "true"

jobs:
  build-setup:
    name: Build Keep Alive Windows Setup EXE
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - name: 1. Checkout repository
        uses: actions/checkout@v4.2.2

      - name: 2. Set up .NET 8 SDK
        uses: actions/setup-dotnet@v4.3.0
        with:
          dotnet-version: "8.0.x"

      - name: 3. Set up Node.js Environment
        uses: actions/setup-node@v4.2.0
        with:
          node-version: "22"

      - name: 4. Determine Dynamic Version Number
        id: versioning
        shell: pwsh
        run: |
          if ("${{ github.ref }}" -like "refs/tags/v*") {
            $ver = "${{ github.ref_name }}".TrimStart('v','V')
          } else {
            $ver = "1.0.${{ github.run_number }}"
          }
          Write-Host "Determined Application Build Version: $ver"
          "APP_VER=$ver" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: 5. Generate multi-resolution icon
        shell: pwsh
        run: |
          ./scripts/Generate-Icon.ps1
          if (!(Test-Path "assets/hoco-keepalive.ico")) {
            throw "Icon asset missing at assets/hoco-keepalive.ico"
          }
          $icon = Get-Item "assets/hoco-keepalive.ico"
          Write-Host "Application icon ready: $($icon.Length) bytes."

      - name: 6. Restore NuGet packages
        shell: pwsh
        run: |
          dotnet restore HocoKeepAlive.csproj
          if (Test-Path "tests/HocoKeepAlive.Tests/HocoKeepAlive.Tests.csproj") {
            dotnet restore tests/HocoKeepAlive.Tests/HocoKeepAlive.Tests.csproj
          }

      - name: 7. Run automated test suite
        shell: pwsh
        run: |
          if (Test-Path "tests/HocoKeepAlive.Tests/HocoKeepAlive.Tests.csproj") {
            dotnet test tests/HocoKeepAlive.Tests/HocoKeepAlive.Tests.csproj --configuration Release --no-restore --logger "console;verbosity=normal"
          } else {
            Write-Host "Tests project not present, skipping test step."
          }

      - name: 8. Publish self-contained Windows x64 binary
        shell: pwsh
        run: |
          $ver = "$env:APP_VER"
          dotnet publish HocoKeepAlive.csproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:Version=$ver `
            -p:FileVersion="$ver.0" `
            -p:AssemblyVersion="$ver.0" `
            -p:DebugType=None `
            -p:DebugSymbols=false `
            --output publish

          $exe = "publish/Keep Alive.exe"
          if (!(Test-Path $exe)) {
            throw "Application executable not found at $exe."
          }
          Write-Host "Published binary validated at $exe ($((Get-Item $exe).Length) bytes)."

      - name: 9. Install Inno Setup compiler
        shell: pwsh
        run: |
          choco install innosetup --yes --no-progress
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) {
            throw "Inno Setup compiler not found at $iscc."
          }
          Write-Host "Inno Setup ready at $iscc"

      - name: 10. Compile Windows Setup EXE Installer
        shell: pwsh
        run: |
          $ver = "$env:APP_VER"
          New-Item -ItemType Directory -Force -Path "installer-output" | Out-Null
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc "/DMyAppVersion=$ver" "installer.iss"

          $setupExe = "installer-output/Keep-Alive-Setup-$ver.exe"
          if (!(Test-Path $setupExe)) {
            throw "Setup EXE was not produced at $setupExe."
          }
          $item = Get-Item $setupExe
          if ($item.Length -lt 100000) {
            throw "Setup EXE file is too small or corrupt ($($item.Length) bytes)."
          }
          Write-Host "SUCCESS: Windows Setup EXE generated at $setupExe ($($item.Length) bytes)."

      - name: 11. Upload Windows Setup EXE Artifact
        uses: actions/upload-artifact@v4.6.1
        with:
          name: Keep-Alive-Setup-v${{ env.APP_VER }}
          path: installer-output/Keep-Alive-Setup-${{ env.APP_VER }}.exe
          if-no-files-found: error
          retention-days: 90

      - name: 12. Create/Update GitHub Release with Setup EXE
        uses: softprops/action-gh-release@v2
        with:
          files: installer-output/Keep-Alive-Setup-${{ env.APP_VER }}.exe
          name: "Keep Alive v${{ env.APP_VER }} (Windows Setup Installer)"
          tag_name: "v${{ env.APP_VER }}"
          draft: false
          prerelease: false
          generate_release_notes: true
